apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: shelfwise
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        app.kubernetes.io/part-of: shelfwise
    spec:
      containers:
        - name: backend
          image: shelfwise/backend:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 8
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: shelfwise
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 3000
      targetPort: http
