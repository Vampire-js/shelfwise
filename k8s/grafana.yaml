apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: shelfwise
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: Shelfwise
        folder: Bookstore
        type: file
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard
  namespace: shelfwise
data:
  bookstore.json: |
    {
      "annotations":{"list":[]},
      "editable":true,
      "panels":[
        {
          "datasource":{"type":"prometheus","uid":"prometheus"},
          "fieldConfig":{"defaults":{"unit":"reqps"}},
          "gridPos":{"h":8,"w":12,"x":0,"y":0},
          "id":1,
          "targets":[{"expr":"sum by (method, route) (rate(bookstore_http_requests_total[1m]))","legendFormat":"{{method}} {{route}}"}],
          "title":"HTTP request rate",
          "type":"timeseries"
        },
        {
          "datasource":{"type":"prometheus","uid":"prometheus"},
          "fieldConfig":{"defaults":{"unit":"Bps"}},
          "gridPos":{"h":8,"w":12,"x":12,"y":0},
          "id":2,
          "targets":[{"expr":"sum by (route) (rate(bookstore_http_response_bytes_total[1m]))","legendFormat":"{{route}}"}],
          "title":"Response traffic",
          "type":"timeseries"
        },
        {
          "datasource":{"type":"prometheus","uid":"prometheus"},
          "fieldConfig":{"defaults":{"min":0}},
          "gridPos":{"h":10,"w":24,"x":0,"y":8},
          "id":3,
          "targets":[{"expr":"bookstore_book_stock","instant":true,"legendFormat":"{{title}}"}],
          "title":"Remaining stock by book",
          "type":"bargauge"
        }
      ],
      "refresh":"5s",
      "schemaVersion":41,
      "tags":["bookstore","devops"],
      "time":{"from":"now-15m","to":"now"},
      "title":"Shelfwise Bookstore Overview",
      "uid":"shelfwise-overview",
      "version":1
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: shelfwise
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:12.1.1
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
          volumeMounts:
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources/datasource.yaml
              subPath: datasource.yaml
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
              subPath: dashboards.yaml
            - name: dashboard
              mountPath: /var/lib/grafana/dashboards/bookstore.json
              subPath: bookstore.json
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
      volumes:
        - name: provisioning
          configMap:
            name: grafana-provisioning
        - name: dashboard
          configMap:
            name: grafana-dashboard
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: shelfwise
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 30091
