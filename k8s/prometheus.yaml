apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: shelfwise
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
    scrape_configs:
      - job_name: bookstore-api
        metrics_path: /metrics
        static_configs:
          - targets:
              - backend:3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: shelfwise
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: shelfwise
spec:
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
